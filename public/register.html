<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Simple Site</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="logo">SimpleSite</div>
            <nav class="nav">
                <a href="/">Home</a>
                <a href="/about">About Us</a>
                <a href="/product">Product</a>
                <a href="/contact">Contact Us</a>
                <a href="/register" class="btn active">Register</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="page-section">
            <h1>Register</h1>
            <form class="form" action="/register" method="POST">
                <div class="form-group">
                    <label for="username">Nume</label>
                    <input type="text" id="username" name="username" placeholder="Nume" required />
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email" required />
                </div>
                <div class="form-group">
                    <label for="password">Parolă</label>
                    <input type="password" id="password" name="password" placeholder="Parola" required />
                </div>
                <div class="form-group">
                    <label for="age">Vârstă</label>
                    <input type="number" id="age" name="age" placeholder="Vârsta" required />
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            &copy; <span id="year"></span> SimpleSite. Toate drepturile rezervate.
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
